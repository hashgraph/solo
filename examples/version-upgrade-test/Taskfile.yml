version: 3

env:
  SOLO_COMMAND:
    sh: |
      if [ "${USE_RELEASED_VERSION}" = "true" ]; then
        echo "npx @hashgraph/solo"
      else
        echo "npm run solo --"
      fi
  # Temporary workaround for block node live-stream importer instability during
  # version-upgrade tests. Keep record streams enabled for mirror services while
  # still exercising block node deploy/upgrade.
  BLOCK_STREAM_STREAM_MODE: BOTH
  BLOCK_STREAM_WRITER_MODE: FILE_AND_GRPC
  DISABLE_IMPORTER_SPRING_PROFILES: 'true'

vars:
  NODE_IDENTIFIERS: 'node1,node2'
  SOLO_NETWORK_SIZE: '2'
  DEPLOYMENT: 'deployment-version-upgrade-test'
  NAMESPACE: 'namespace-version-upgrade-test'
  CLUSTER_NAME: 'version-upgrade-test-cluster'
  CONTEXT: 'kind-version-upgrade-test-cluster'
  CLUSTER_REFERENCE: 'kind-version-upgrade-test-cluster'

  # Previous versions (current minus one)
  PREV_CN_VERSION:
    sh: sed -n "s/.*TEST_UPGRADE_FROM_VERSION.*'\([^']*\)'.*/\1/p" "$(git rev-parse --show-toplevel)/version-test.ts"
  PREV_MIRROR_VERSION:
    sh: sed -n "s/.*PREV_MIRROR_NODE_VERSION.*'\([^']*\)'.*/\1/p" "$(git rev-parse --show-toplevel)/version-test.ts"
  PREV_EXPLORER_VERSION:
    sh: sed -n "s/.*PREV_EXPLORER_VERSION.*'\([^']*\)'.*/\1/p" "$(git rev-parse --show-toplevel)/version-test.ts"
  PREV_RELAY_VERSION:
    sh: sed -n "s/.*PREV_RELAY_VERSION.*'\([^']*\)'.*/\1/p" "$(git rev-parse --show-toplevel)/version-test.ts"
  PREV_BLOCK_VERSION:
    sh: sed -n "s/.*PREV_BLOCK_NODE_VERSION.*'\([^']*\)'.*/\1/p" "$(git rev-parse --show-toplevel)/version-test.ts"

  # Current versions to upgrade to
  CURRENT_CN_VERSION:
    sh: sed -n "s/^export const HEDERA_PLATFORM_VERSION.*'\([^']*\)'.*/\1/p" "$(git rev-parse --show-toplevel)/version.ts"
  CURRENT_MIRROR_VERSION:
    sh: sed -n "s/^export const MIRROR_NODE_VERSION.*'\([^']*\)'.*/\1/p" "$(git rev-parse --show-toplevel)/version.ts"
  CURRENT_BLOCK_VERSION:
    sh: sed -n "s/^export const BLOCK_NODE_VERSION.*'\([^']*\)'.*/\1/p" "$(git rev-parse --show-toplevel)/version.ts"
  # Local build path for network upgrade
  ROOT_DIR:
    sh: git rev-parse --show-toplevel

tasks:
  default:
    desc: Run full version upgrade test scenario
    cmds:
      - task: setup-cluster
      - task: deploy-old-versions
      - task: upgrade-components
      - task: verify-functionality

  setup-cluster:
    desc: Setup Kind cluster and Solo environment
    cmds:
      # Install Solo CLI
      - cmd: |
          if [ "${USE_RELEASED_VERSION}" = "true" ]; then
            npm i @hashgraph/solo@latest
          else
            echo "Skipping npm install - using development version"
          fi

      # Create Kind cluster
      - cmd: |
          SHARED_KIND_CONFIG="{{ .TASKFILE_DIR }}/../../resources/kind-config.yaml"
          if [ -f "${SHARED_KIND_CONFIG}" ]; then
            kind create cluster -n {{ .CLUSTER_NAME }} --config "${SHARED_KIND_CONFIG}"
          else
            kind create cluster -n {{ .CLUSTER_NAME }}
          fi

      # Wait for control plane
      - cmd: sleep 10

      # Set kubectl context
      - cmd: kubectl config set-context {{ .CONTEXT }}

      # Solo cluster-ref config setup
      - cmd: $SOLO_COMMAND cluster-ref config setup --quiet-mode --dev

      # Solo cluster-ref config connect
      - cmd: $SOLO_COMMAND cluster-ref config connect --cluster-ref {{ .CLUSTER_REFERENCE }} --context {{ .CONTEXT }}

      # Solo deployment config create
      - cmd: $SOLO_COMMAND deployment config create --deployment {{ .DEPLOYMENT }} --namespace {{ .NAMESPACE }}

      # Solo deployment cluster attach
      - cmd: |
          $SOLO_COMMAND deployment cluster attach --deployment {{ .DEPLOYMENT }} --cluster-ref {{ .CLUSTER_REFERENCE }} \
          --num-consensus-nodes {{ .SOLO_NETWORK_SIZE }}

  deploy-old-versions:
    desc: Deploy network with previous versions of all components
    cmds:
      # Deploy consensus network with previous version
      - cmd: |
          $SOLO_COMMAND keys consensus generate --gossip-keys --tls-keys --deployment {{ .DEPLOYMENT }} \
          --node-aliases {{ .NODE_IDENTIFIERS }}

      # Deploy block node with previous version
      # Must deploy block node before deploying consensus network due to dependency
      - cmd: |
          $SOLO_COMMAND block node add --deployment {{ .DEPLOYMENT }} --release-tag {{ .PREV_CN_VERSION }} \
          --chart-version {{ .PREV_BLOCK_VERSION }} \
          --consensus-node-version {{ .PREV_CN_VERSION }}

      - cmd: |
          $SOLO_COMMAND consensus network deploy --deployment {{ .DEPLOYMENT }} --pvcs true --node-aliases {{ .NODE_IDENTIFIERS }} \
          --release-tag {{ .PREV_CN_VERSION }}

      - cmd: $SOLO_COMMAND consensus node setup --node-aliases {{ .NODE_IDENTIFIERS }} --deployment {{ .DEPLOYMENT }} --release-tag {{ .PREV_CN_VERSION }}

      - cmd: $SOLO_COMMAND consensus node start --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_IDENTIFIERS }}

      - cmd: $SOLO_COMMAND ledger account create --deployment {{ .DEPLOYMENT }} --hbar-amount 50

      # Deploy mirror node with previous version
      - cmd: |
          $SOLO_COMMAND mirror node add --deployment {{ .DEPLOYMENT }} \
          --pinger --enable-ingress --mirror-node-version {{ .PREV_MIRROR_VERSION }}

      # Deploy relay with previous version
      - cmd: |
          $SOLO_COMMAND relay node add --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_IDENTIFIERS }} \
          --relay-release {{ .PREV_RELAY_VERSION }}

      # Deploy explorer with previous version
      - cmd: |
          $SOLO_COMMAND explorer node add --deployment {{ .DEPLOYMENT }} \
          --enable-ingress --explorer-version {{ .PREV_EXPLORER_VERSION }}
      - cmd: $SOLO_COMMAND ledger account create --deployment {{ .DEPLOYMENT }} --hbar-amount 50

      - echo "All components deployed with previous versions"

  upgrade-components:
    desc: Upgrade all components to current versions
    cmds:
      # Upgrade mirror node to solo's current default version so the target tracks version.ts instead of a stale pin
      - cmd: |
          $SOLO_COMMAND mirror node upgrade --deployment {{ .DEPLOYMENT }} \
          --mirror-node-version {{ .CURRENT_MIRROR_VERSION }} \
          --pinger
      - cmd: $SOLO_COMMAND ledger account create --deployment {{ .DEPLOYMENT }} --hbar-amount 50

      # Stage the network upgrade to main with local build path, but leave the consensus nodes
      # stopped. Consensus node and block node must cross the fixed 16-slot block root hash
      # boundary (hiero-consensus-node#26918) together: an upgraded consensus node streaming to a
      # pre-0.41.0 block node is rejected with BAD_BLOCK_PROOF, which saturates the consensus node
      # block buffer and stalls the network. Upgrading both while no consensus node is producing
      # removes that window entirely, so no version comparison is needed here.
      - cmd: |
          echo "Upgrading consensus network to version: {{ .CURRENT_CN_VERSION }}"
          SOLO_LOG_LEVEL=debug $SOLO_COMMAND consensus network upgrade --node-aliases {{ .NODE_IDENTIFIERS }} \
          --upgrade-version {{ .CURRENT_CN_VERSION }} \
          --deployment {{ .DEPLOYMENT }} \
          --skip-node-start

      # Upgrade block node while the consensus nodes are still stopped
      - cmd: |
          $SOLO_COMMAND block node upgrade --deployment {{ .DEPLOYMENT }} \
          --upgrade-version {{ .CURRENT_BLOCK_VERSION }} \
          --consensus-node-version {{ .CURRENT_CN_VERSION }}

      # Start the upgraded consensus nodes now that the block node also speaks the new format
      - cmd: |
          $SOLO_COMMAND consensus node start --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_IDENTIFIERS }}

      - cmd: $SOLO_COMMAND ledger account create --deployment {{ .DEPLOYMENT }} --hbar-amount 50

      # Upgrade relay
      - cmd: |
          $SOLO_COMMAND relay node upgrade --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_IDENTIFIERS }}

      # Upgrade explorer
      - cmd: |
          $SOLO_COMMAND explorer node upgrade --deployment {{ .DEPLOYMENT }}

  verify-functionality:
    desc: Verify all components are working correctly
    cmds:
      # Create first account and capture ID
      - cmd: |
          ACCOUNT_ID=$($SOLO_COMMAND ledger account create --deployment {{ .DEPLOYMENT }} --hbar-amount 100 | grep -o '0\.0\.[0-9]*' | head -1)
          echo "Created first account: $ACCOUNT_ID"
          echo "$ACCOUNT_ID" > /tmp/first_account_id.txt
      - echo "First account created and ID captured"

      # Create second account
      - cmd: $SOLO_COMMAND ledger account create --deployment {{ .DEPLOYMENT }} --hbar-amount 50
      - echo "Second account created"

      # Wait for transactions to be processed
      - cmd: sleep 30

      # Check Explorer REST API for the first account
      - cmd: |
          ACCOUNT_ID=$(cat /tmp/first_account_id.txt)
          echo "Checking Explorer API for account: $ACCOUNT_ID"

          # Get the explorer service URL (assuming port-forward or ingress)
          EXPLORER_URL="http://localhost:38080"

          # Try to access the account via Explorer API
          curl -s "${EXPLORER_URL}/api/v1/accounts/${ACCOUNT_ID}" | jq '.' || echo "Explorer API check completed"
      - echo "Explorer API verification completed"

      # Test Relay functionality
      - cmd: |
          # Get relay service URL (assuming port-forward or ingress)
          RELAY_URL="http://localhost:37546"

          # Make a simple JSON-RPC call to verify relay is working
          curl -X POST "${RELAY_URL}" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
            | jq '.' || echo "Relay API check completed"
      - echo "Relay API verification completed"

      - echo "All functionality verification completed successfully!"

      # Test Block Node functionality.
      # get-block.sh always requests the latest block, so a single SUCCESS response only proves the
      # block node still serves what it persisted before the upgrade. Sample twice and require the
      # block number to advance, otherwise a block node that stopped verifying the upgraded
      # consensus node's proofs (see the 16-slot boundary note in upgrade-components) reports
      # SUCCESS forever on a stale block and this check false-passes.
      - cmd: |
          kubectl port-forward --namespace {{ .NAMESPACE }} svc/block-node-1 40840:40840 >/tmp/solo-block-node-port-forward.log 2>&1 &
          cd ../../test/data

          latest_block_number() {
            ./get-block.sh 2>/dev/null | jq -rs 'if any(.[]; .status == "SUCCESS") then [.. | .number? | select(. != null)] | first // empty else empty end'
          }

          FIRST=$(latest_block_number)
          if [[ -z "${FIRST}" ]]; then
            echo "✗ Block node test failed - could not read a SUCCESS block response"
            ./get-block.sh || true
            exit 1
          fi
          echo "Block node latest block: ${FIRST}"

          for _ in $(seq 1 12); do
            sleep 5
            SECOND=$(latest_block_number)
            if [[ -n "${SECOND}" ]] && (( SECOND > FIRST )); then
              echo "✓ Block node test passed - advanced from block ${FIRST} to ${SECOND}"
              exit 0
            fi
          done

          echo "✗ Block node test failed - stuck at block ${FIRST} (last read: ${SECOND:-none})"
          exit 1

  destroy:
    desc: Destroy the Solo network and cleanup
    cmds:
      # Stop consensus nodes
      - cmd: $SOLO_COMMAND consensus node stop --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_IDENTIFIERS }}

      # Destroy explorer
      - cmd: $SOLO_COMMAND explorer node destroy --deployment {{ .DEPLOYMENT }} --force

      # Destroy relay
      - cmd: $SOLO_COMMAND relay node destroy --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_IDENTIFIERS }}

      # Destroy mirror node
      - cmd: $SOLO_COMMAND mirror node destroy --deployment {{ .DEPLOYMENT }} --force

      # Destroy block node
      - cmd: $SOLO_COMMAND block node destroy --deployment {{ .DEPLOYMENT }}

      # Destroy consensus network
      - cmd: $SOLO_COMMAND consensus network destroy --deployment {{ .DEPLOYMENT }} --force

      # Delete Kind cluster
      - cmd: kind delete cluster -n {{ .CLUSTER_NAME }}

      # Cleanup temp files
      - cmd: rm -f /tmp/first_account_id.txt

      - echo "Cleanup completed"

  status:
    desc: Check status of all components
    cmds:
      - cmd: kubectl get pods -n {{ .NAMESPACE }}
      - cmd: kubectl get services -n {{ .NAMESPACE }}
      - echo "Status check completed"
