blockNode:
  config:
    # The restored mirror importer starts at block 0. The block node must advertise
    # and serve genesis-era blocks so Mirror Node can populate the restored database.
    BLOCK_NODE_EARLIEST_MANAGED_BLOCK: "0"
plugins:
  names: facility-messaging,block-access-service,health,server-status,stream-publisher,stream-subscriber,blocks-file-historic,blocks-file-recent,backfill,block-verification
