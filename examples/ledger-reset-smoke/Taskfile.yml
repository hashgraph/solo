version: "3"

env:
  SOLO_COMMAND:
    sh: |
      if [ "${USE_RELEASED_VERSION}" = "true" ]; then
        echo "npx @hashgraph/solo"
      else
        echo "npm run solo --"
      fi

vars:
  SOLO_CLUSTER_NAME: "{{default \"solo-ledger-reset\" .SOLO_CLUSTER_NAME}}"
  SOLO_NAMESPACE: "{{default \"solo-ledger-reset\" .SOLO_NAMESPACE}}"
  SOLO_CLUSTER_SETUP_NAMESPACE: "{{default \"solo-setup\" .SOLO_CLUSTER_SETUP_NAMESPACE}}"
  SOLO_DEPLOYMENT: "{{default \"solo-ledger-reset\" .SOLO_DEPLOYMENT}}"
  BLOCK_NODE_ENABLED: "{{default \"false\" .BLOCK_NODE_ENABLED}}"
  NODE_ALIASES: "{{default \"node1,node2\" .NODE_ALIASES}}"
  EXPECTED_BALANCE_1: "{{default \"10000\" .EXPECTED_BALANCE_1}}"
  EXPECTED_BALANCE_2: "{{default \"20000\" .EXPECTED_BALANCE_2}}"
  MIRROR_QUERY_RETRIES: "{{default \"60\" .MIRROR_QUERY_RETRIES}}"
  MIRROR_QUERY_SLEEP: "{{default \"5\" .MIRROR_QUERY_SLEEP}}"
  MIRROR_QUERY_MAX_SECONDS: "{{default \"15\" .MIRROR_QUERY_MAX_SECONDS}}"
  SOLO_HOME: "{{default (printf \"%s/.solo\" .HOME) .SOLO_HOME}}"
  MIRROR_BASE_URL: "{{default \"http://localhost:8081\" .MIRROR_BASE_URL}}"
  ACCOUNT_OUTPUT_FILE: "{{default (printf \"%s/logs/ledger-reset/account-output.json\" .SOLO_HOME) .ACCOUNT_OUTPUT_FILE}}"

tasks:
  default:
    desc: "Run deploy, pre-reset test, reset, and post-reset test"
    cmds:
      - task: deploy
      - task: pre-reset-test
      - task: reset
      - task: post-reset-test

  deploy:
    desc: "Create kind cluster and deploy consensus/mirror/explorer/block nodes"
    cmds:

      - cmd: |
          SHARED_KIND_CONFIG="{{ .TASKFILE_DIR }}/../../resources/kind-config.yaml"
          if [ -f "${SHARED_KIND_CONFIG}" ]; then
            kind create cluster -n {{ .SOLO_CLUSTER_NAME }} --config "${SHARED_KIND_CONFIG}"
          else
            kind create cluster -n {{ .SOLO_CLUSTER_NAME }}
          fi

      - cmd: |
          rm -rf "{{.SOLO_HOME}}"
          $SOLO_COMMAND cluster-ref config connect --cluster-ref "kind-{{.SOLO_CLUSTER_NAME}}" --context "kind-{{.SOLO_CLUSTER_NAME}}"
          $SOLO_COMMAND deployment config create -n "{{.SOLO_NAMESPACE}}" --deployment "{{.SOLO_DEPLOYMENT}}"
          $SOLO_COMMAND deployment cluster attach --deployment "{{.SOLO_DEPLOYMENT}}" --cluster-ref "kind-{{.SOLO_CLUSTER_NAME}}" --num-consensus-nodes 2
          $SOLO_COMMAND cluster-ref config setup -s "{{.SOLO_CLUSTER_SETUP_NAMESPACE}}"

      - cmd: |
          if [ "{{.BLOCK_NODE_ENABLED}}" = "true" ]; then
            $SOLO_COMMAND block node add --deployment "{{.SOLO_DEPLOYMENT}}"
          else
            echo "Skipping block node deployment because BLOCK_NODE_ENABLED={{.BLOCK_NODE_ENABLED}}"
          fi
          $SOLO_COMMAND keys consensus generate --gossip-keys --tls-keys --deployment "{{.SOLO_DEPLOYMENT}}" -i "{{.NODE_ALIASES}}"
          $SOLO_COMMAND consensus network deploy --deployment "{{.SOLO_DEPLOYMENT}}" -i "{{.NODE_ALIASES}}" --pvcs
          $SOLO_COMMAND consensus node setup --deployment "{{.SOLO_DEPLOYMENT}}" -i "{{.NODE_ALIASES}}"
          $SOLO_COMMAND consensus node start --deployment "{{.SOLO_DEPLOYMENT}}" -i "{{.NODE_ALIASES}}"

      - cmd: |
          $SOLO_COMMAND mirror node add --deployment "{{.SOLO_DEPLOYMENT}}" --enable-ingress --pinger
          $SOLO_COMMAND relay node add --deployment "{{.SOLO_DEPLOYMENT}}"
          $SOLO_COMMAND explorer node add --deployment "{{.SOLO_DEPLOYMENT}}" --dev

  pre-reset-test:
    desc: "Create an account (balance {{.EXPECTED_BALANCE_1}}) and verify via mirror REST"
    cmds:
      - cmd: |
          set -euo pipefail
          SMOKE_SCRIPT="{{.TASKFILE_DIR}}/../../.github/workflows/script/solo_smoke_test.sh"
          if [[ -f "${SMOKE_SCRIPT}" ]]; then
            echo "Solo repo detected. Running smoke test script."
            (
              cd "{{.TASKFILE_DIR}}/../.."
              export SOLO_DEPLOYMENT="{{ .SOLO_DEPLOYMENT }}"
              export SOLO_NAMESPACE="{{ .SOLO_NAMESPACE }}"
              ./.github/workflows/script/solo_smoke_test.sh
            )
          else
            echo "Solo repo not detected. Running ledger account create validation."
            mkdir -p "$(dirname "{{.ACCOUNT_OUTPUT_FILE}}")"
            $SOLO_COMMAND ledger account create --deployment "{{.SOLO_DEPLOYMENT}}" --hbar-amount "{{.EXPECTED_BALANCE_1}}" --create-amount 1 | tee "{{.ACCOUNT_OUTPUT_FILE}}"
            ACCOUNT_OUTPUT="{{.ACCOUNT_OUTPUT_FILE}}" EXPECTED_BALANCE="{{.EXPECTED_BALANCE_1}}" TIMEOUT_SECS="5" \
              task -d "{{.TASKFILE_DIR}}" verify-account
          fi

  reset:
    desc: "Reset ledger to genesis with consensus pod restart enabled"
    cmds:
      - |
        set -euo pipefail
        mkdir -p "{{.SOLO_HOME}}/logs/ledger-reset"
        SOLO_LEDGER_RESET_SKIP_POD_RESTART=false \
          $SOLO_COMMAND ledger system reset --deployment "{{.SOLO_DEPLOYMENT}}"

  post-reset-test:
    desc: "Create an account (balance {{.EXPECTED_BALANCE_2}}) and verify via mirror REST"
    cmds:
      - cmd: |
          set -euo pipefail
          SMOKE_SCRIPT="{{.TASKFILE_DIR}}/../../.github/workflows/script/solo_smoke_test.sh"
          if [[ -f "${SMOKE_SCRIPT}" ]]; then
            echo "Solo repo detected. Running smoke test script."
            (
              cd "{{.TASKFILE_DIR}}/../.."
              export SOLO_DEPLOYMENT="{{ .SOLO_DEPLOYMENT }}"
              export SOLO_NAMESPACE="{{ .SOLO_NAMESPACE }}"
              ./.github/workflows/script/solo_smoke_test.sh
            )
          else
            echo "Solo repo not detected. Running ledger account create validation."
            mkdir -p "$(dirname "{{.ACCOUNT_OUTPUT_FILE}}")"
            $SOLO_COMMAND ledger account create --deployment "{{.SOLO_DEPLOYMENT}}" --hbar-amount "{{.EXPECTED_BALANCE_2}}" --create-amount 1 | tee "{{.ACCOUNT_OUTPUT_FILE}}"
            ACCOUNT_OUTPUT="{{.ACCOUNT_OUTPUT_FILE}}" EXPECTED_BALANCE="{{.EXPECTED_BALANCE_2}}" TIMEOUT_SECS="5" \
              task -d "{{.TASKFILE_DIR}}" verify-account
          fi


  verify-account:
    desc: "Verify account balance via mirror REST"
    cmds:
      - cmd: |
          set -euo pipefail
          if [[ -z "${ACCOUNT_OUTPUT:-}" ]]; then
            echo "ERROR: ACCOUNT_OUTPUT is required." >&2
            exit 1
          fi
          if [[ -z "${EXPECTED_BALANCE:-}" ]]; then
            echo "ERROR: EXPECTED_BALANCE is required." >&2
            exit 1
          fi
          ACCOUNT_ID="$(grep -o '"accountId": "[^"]*"' "${ACCOUNT_OUTPUT}" | head -n 1 | sed 's/"accountId": "\(.*\)"/\1/')"
          if [[ -z "${ACCOUNT_ID}" ]]; then
            echo "ERROR: accountId not found in output" >&2
            exit 1
          fi
          echo "Created account: ${ACCOUNT_ID}"
          EXPECTED="${EXPECTED_BALANCE}00000000"
          MAX_RETRIES="${MIRROR_QUERY_RETRIES:-60}"
          SLEEP_SECONDS="${MIRROR_QUERY_SLEEP:-5}"
          ATTEMPT=1
          while [[ "${ATTEMPT}" -le "${MAX_RETRIES}" ]]; do
            RESPONSE="$(curl -s --max-time "${TIMEOUT_SECS:-5}" "{{.MIRROR_BASE_URL}}/api/v1/accounts/${ACCOUNT_ID}" || true)"
            echo "Mirror REST response (attempt ${ATTEMPT}/${MAX_RETRIES}): ${RESPONSE}"
            if echo "${RESPONSE}" | grep -Eq '"accountId"|"account"'; then
              BALANCE="$(echo "${RESPONSE}" | tr -d '\n' | grep -o '"balance":[0-9]\+' | head -n 1 | sed 's/"balance"://')"
              if [[ "${BALANCE}" = "${EXPECTED}" ]]; then
                echo "Mirror balance OK: ${BALANCE}"
                exit 0
              fi
              echo "Account found but balance mismatch: ${BALANCE} (expected ${EXPECTED})"
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep "${SLEEP_SECONDS}"
          done
          echo "ERROR: Mirror REST did not return account ${ACCOUNT_ID} with expected balance ${EXPECTED} after ${MAX_RETRIES} attempts." >&2
          exit 1
