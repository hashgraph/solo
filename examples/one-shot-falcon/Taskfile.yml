version: 3

env:
  SOLO_COMMAND:
    sh: |
      if [ "${USE_RELEASED_VERSION}" = "true" ]; then
        echo "npx @hashgraph/solo"
      else
        echo "npm run solo --"
      fi

vars:
  DEPLOYMENT: "falcon-deployment"
  CLUSTER_NAME: "falcon-cluster"
  CONTEXT: "kind-falcon-cluster"
  TEMP_DIR: "{{ .USER_WORKING_DIR }}/.tmp"
  KILLED_PORT_FILE: "{{ .TEMP_DIR }}/killed_port.txt"
  EXPECTED_PORT_COUNT_FILE: "{{ .TEMP_DIR }}/expected_port_count.txt"
  RELEASE_TAG:
    sh: |
      awk -v RS=';' '/HEDERA_PLATFORM_VERSION[[:space:]]*:[[:space:]]*string[[:space:]]*=/{s=$0;v="";while(match(s,/'"'"'[^'"'"']*'"'"'/)){v=substr(s,RSTART+1,RLENGTH-2);s=substr(s,RSTART+RLENGTH)};if(v!="")print v}' \
        "$(git rev-parse --show-toplevel)/version.ts"

tasks:
  deploy:
    desc: Deploy a complete Hiero network using one-shot falcon deploy
    env:
      ONE_SHOT_WITH_BLOCK_NODE: '{{default "true" .ONE_SHOT_WITH_BLOCK_NODE}}'
    cmds:
      # if using released version of Solo, make sure to run from solo project root directory
      - cmd: |
          if [ "${USE_RELEASED_VERSION}" = "true" ]; then
            cd ../../solo || exit 1
          else
            echo "Skipping cd - using development version"
          fi
      # Install Solo CLI
      - cmd: |
          if [ "${USE_RELEASED_VERSION}" = "true" ]; then
            npm i @hashgraph/solo@latest
          else
            echo "Skipping npm install - using development version"
          fi

      # Solo one-shot falcon deploy
      - cmd: |
          RESOLVED=$(mktemp /tmp/falcon-values-XXXXXX)
          RELEASE_TAG="{{ .RELEASE_TAG }}"
          sed -e "s/\${SOLO_RELEASE_TAG_NO_V}/${RELEASE_TAG#v}/g" \
              -e "s/\${SOLO_RELEASE_TAG}/${RELEASE_TAG}/g" \
            "{{ .USER_WORKING_DIR }}/falcon-values.yaml" > "${RESOLVED}"
          $SOLO_COMMAND one-shot falcon deploy \
            --values-file "${RESOLVED}" --num-consensus-nodes 2 --no-rollback
          rm -f "${RESOLVED}"

  deploy-minimal:
    desc: Deploy with consensus and mirror node only (without explorer and relay)
    env:
      ONE_SHOT_WITH_BLOCK_NODE: '{{default "true" .ONE_SHOT_WITH_BLOCK_NODE}}'
    cmds:
      # Solo one-shot falcon deploy with disabled components
      - cmd: |
          RESOLVED=$(mktemp /tmp/falcon-values-XXXXXX)
          RELEASE_TAG="{{ .RELEASE_TAG }}"
          sed -e "s/\${SOLO_RELEASE_TAG_NO_V}/${RELEASE_TAG#v}/g" \
              -e "s/\${SOLO_RELEASE_TAG}/${RELEASE_TAG}/g" \
            "{{ .USER_WORKING_DIR }}/falcon-values.yaml" > "${RESOLVED}"
          $SOLO_COMMAND one-shot falcon deploy \
            --values-file "${RESOLVED}" --num-consensus-nodes 2 \
            --deploy-explorer=false --deploy-relay=false
          rm -f "${RESOLVED}"

  deploy-consensus-only:
    desc: Deploy consensus nodes only (without mirror, explorer, and relay)
    env:
      ONE_SHOT_WITH_BLOCK_NODE: '{{default "true" .ONE_SHOT_WITH_BLOCK_NODE}}'
    cmds:
      # Solo one-shot falcon deploy with only consensus nodes
      - cmd: |
          RESOLVED=$(mktemp /tmp/falcon-values-XXXXXX)
          RELEASE_TAG="{{ .RELEASE_TAG }}"
          sed -e "s/\${SOLO_RELEASE_TAG_NO_V}/${RELEASE_TAG#v}/g" \
              -e "s/\${SOLO_RELEASE_TAG}/${RELEASE_TAG}/g" \
            "{{ .USER_WORKING_DIR }}/falcon-values.yaml" > "${RESOLVED}"
          $SOLO_COMMAND one-shot falcon deploy \
            --values-file "${RESOLVED}" --num-consensus-nodes 2 \
            --deploy-mirror-node=false --deploy-explorer=false --deploy-relay=false
          rm -f "${RESOLVED}"

  test-refresh:
    desc: Kill one port-forward, then run deployment refresh port-forwards
    cmds:    
      - cmd: |
          mkdir -p "{{ .TEMP_DIR }}"
          echo "==== Normalizing port-forwards before baseline ===="
          RESOLVED_DEPLOYMENT="$(node {{ .USER_WORKING_DIR }}/resolve-deployment.mjs "{{ .DEPLOYMENT }}")"
          $SOLO_COMMAND deployment refresh port-forwards --deployment "${RESOLVED_DEPLOYMENT}" --dev
          echo ""

      - cmd: |
          node {{ .USER_WORKING_DIR }}/port-forward-status.mjs \
            --mode summary \
            --expected-port-count-file "{{ .EXPECTED_PORT_COUNT_FILE }}"
          echo ""

      - cmd: |
          echo "==== Killing a random port-forward process ===="
          node {{ .USER_WORKING_DIR }}/select-random-port-forward.mjs \
            --kill \
            --log-file "{{ .TEMP_DIR }}/port-forward-random.log" \
            --killed-port-file "{{ .KILLED_PORT_FILE }}"

      - cmd: |
          echo ""
          echo "==== Port-forward processes after killing one ===="
          node {{ .USER_WORKING_DIR }}/port-forward-status.mjs --mode summary
          echo ""

      - cmd: |
          echo "==== Running deployment refresh command ===="
          RESOLVED_DEPLOYMENT="$(node {{ .USER_WORKING_DIR }}/resolve-deployment.mjs "{{ .DEPLOYMENT }}")"
          echo "Using deployment: ${RESOLVED_DEPLOYMENT}"

          if ! $SOLO_COMMAND deployment refresh port-forwards --help >/dev/null 2>&1; then
            if [ "${USE_RELEASED_VERSION}" != "true" ]; then
              echo "Refresh command not found in current local Solo build. Running task build and retrying..."
              task build
            fi
          fi

          if ! $SOLO_COMMAND deployment refresh port-forwards --help >/dev/null 2>&1; then
            echo "ERROR: 'deployment refresh port-forwards' is not supported by the current Solo CLI." >&2
            echo "Use a newer Solo version (or rebuild local Solo) and retry." >&2
            exit 1
          fi

          $SOLO_COMMAND deployment refresh port-forwards --deployment "${RESOLVED_DEPLOYMENT}" --dev

      - cmd: |
          echo ""
          echo "==== Port-forward processes after refresh ===="
          node {{ .USER_WORKING_DIR }}/port-forward-status.mjs --mode summary
          echo ""

  verify:
    desc: Verify killed port-forward was restored
    cmds:
      - cmd: |
          echo "==== Verifying port-forwards ===="
          node {{ .USER_WORKING_DIR }}/port-forward-status.mjs \
            --mode verify \
            --expected-port-count-file "{{ .EXPECTED_PORT_COUNT_FILE }}" \
            --killed-port-file "{{ .KILLED_PORT_FILE }}"

          RESOLVED_DEPLOYMENT="$(node {{ .USER_WORKING_DIR }}/resolve-deployment.mjs "{{ .DEPLOYMENT }}")"
          RESOLVED_NAMESPACE="$(node {{ .USER_WORKING_DIR }}/resolve-deployment.mjs "{{ .DEPLOYMENT }}" namespace)"
          echo "Using deployment: ${RESOLVED_DEPLOYMENT}"
          echo "Using namespace: ${RESOLVED_NAMESPACE}"
          export SOLO_DEPLOYMENT="${RESOLVED_DEPLOYMENT}"
          export SOLO_NAMESPACE="$RESOLVED_NAMESPACE"

          if [ "$(node -p "process.platform")" = "win32" ]; then
            echo "Skipping solo smoke test on Windows: .github/workflows/script/solo_smoke_test.sh is POSIX shell."
          elif git rev-parse --show-toplevel >/dev/null 2>&1; then
            REPO_ROOT="$(git rev-parse --show-toplevel)"
            echo "Running solo smoke test from repo root: ${REPO_ROOT}"
            (cd "${REPO_ROOT}" && .github/workflows/script/solo_smoke_test.sh)
          else
            echo "Skipping solo smoke test: not running from a git repo checkout (likely release zip)."
          fi

  test-env-passthrough:
    desc: Demonstrate subprocess.additionalEnvironmentVariables against an isolated Solo home
    env:
      EXAMPLE_PASSTHROUGH_ACCEPTED: "accepted-value"
      EXAMPLE_PASSTHROUGH_CONTROL: "control-value"
    cmds:
      # Solo does not forward this shell's environment to the commands it runs; it builds each
      # command's environment from a per-command allowlist, so a variable a managed-Kubernetes
      # credential plugin needs (EKS IRSA and friends) must be named explicitly. See GitHub
      # issue #5895.
      #
      # This task uses a throwaway SOLO_HOME under .tmp and never touches ~/.solo: the operator's
      # real solo-config.yaml must not be overwritten by running an example.
      #
      # ACCEPTED is declared for helm and kubectl only. CONTROL is declared nowhere, so the
      # assertions below fail if the feature silently stops working.
      - cmd: |
          set -eu
          DEMO_SOLO_HOME="{{ .TEMP_DIR }}/env-passthrough-home"
          rm -rf "${DEMO_SOLO_HOME}"
          mkdir -p "${DEMO_SOLO_HOME}"
          cat > "${DEMO_SOLO_HOME}/solo-config.yaml" <<'SOLO_CONFIG'
          subprocess:
            additionalEnvironmentVariables:
              helm:
                - EXAMPLE_PASSTHROUGH_ACCEPTED
              kubectl:
                - EXAMPLE_PASSTHROUGH_ACCEPTED
          SOLO_CONFIG
          # Solo refuses the file unless it, and the directories above it, are owner-only.
          chmod 700 "${DEMO_SOLO_HOME}"
          chmod 600 "${DEMO_SOLO_HOME}/solo-config.yaml"

          # Run Solo against the cluster this example already created, with the isolated home.
          SOLO_HOME="${DEMO_SOLO_HOME}" $SOLO_COMMAND cluster-ref config connect \
            --cluster-ref env-passthrough-ref --context {{ .CONTEXT }}
          SOLO_HOME="${DEMO_SOLO_HOME}" $SOLO_COMMAND cluster-ref config setup \
            --cluster-ref env-passthrough-ref

          SOLO_LOG="${DEMO_SOLO_HOME}/logs/solo.log"
          echo "==== Verifying subprocess environment passthrough against ${SOLO_LOG} ===="

          if ! grep -q "withheld from " "${SOLO_LOG}"; then
            echo "ERROR: no withheld-variable diagnostics in ${SOLO_LOG}" >&2
            exit 1
          fi

          # helm is guaranteed: cluster-ref config setup installs charts through it. kubectl is
          # asserted only when present, because it is spawned by the dependency check rather than
          # by these commands directly, and an example should not fail on an incidental detail.
          # Exhaustive per-profile behaviour is covered by
          # test/unit/core/subprocess-environment.test.ts, which is where it belongs.
          for profile in helm kubectl; do
            if ! grep -q "withheld from '\?${profile}'\?:" "${SOLO_LOG}"; then
              if [ "${profile}" = "helm" ]; then
                echo "ERROR: no withheld-variable diagnostics for helm; expected chart installation to spawn it" >&2
                exit 1
              fi
              echo "SKIP: ${profile} was not spawned during this run"
              continue
            fi
            if grep "withheld from '\?${profile}'\?:" "${SOLO_LOG}" | grep -q "EXAMPLE_PASSTHROUGH_ACCEPTED"; then
              echo "ERROR: EXAMPLE_PASSTHROUGH_ACCEPTED was withheld from ${profile} despite being declared for it" >&2
              exit 1
            fi
            if ! grep "withheld from '\?${profile}'\?:" "${SOLO_LOG}" | grep -q "EXAMPLE_PASSTHROUGH_CONTROL"; then
              echo "ERROR: EXAMPLE_PASSTHROUGH_CONTROL should have been withheld from ${profile}" >&2
              exit 1
            fi
            echo "OK: ${profile} received EXAMPLE_PASSTHROUGH_ACCEPTED and not EXAMPLE_PASSTHROUGH_CONTROL"
          done

          # Per-command containment: a variable declared for helm/kubectl must not reach npm.
          if grep -q "withheld from '\?npm'\?:" "${SOLO_LOG}"; then
            if ! grep "withheld from '\?npm'\?:" "${SOLO_LOG}" | grep -q "EXAMPLE_PASSTHROUGH_ACCEPTED"; then
              echo "ERROR: EXAMPLE_PASSTHROUGH_ACCEPTED reached npm, which it was not declared for" >&2
              exit 1
            fi
            echo "OK: EXAMPLE_PASSTHROUGH_ACCEPTED did not reach npm"
          fi

  test:
    desc: Run deploy + refresh-recovery verification
    cmds:
      - task: deploy
      - task: test-env-passthrough
      - task: test-refresh
      - task: verify

  destroy:
    desc: Destroy the Solo network using one-shot falcon destroy
    env:
      ONE_SHOT_WITH_BLOCK_NODE: '{{default "true" .ONE_SHOT_WITH_BLOCK_NODE}}'
    cmds:
      # Solo one-shot falcon destroy
      - cmd: $SOLO_COMMAND one-shot falcon destroy

      # Delete Kind cluster
      - cmd: kind delete cluster -n {{ .CLUSTER_NAME }}

  default:
    desc: Run deploy + refresh-recovery verification
    cmds:
      - task: test
