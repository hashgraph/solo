version: 3

env:
  SOLO_COMMAND:
    sh: |
      if [ "${USE_RELEASED_VERSION}" = "true" ]; then
        echo "npx @hashgraph/solo"
      else
        echo "npm run solo --silent --"
      fi

vars:
  # Network Configuration
  NETWORK_SIZE: '2'
  NODE_ALIASES: 'node1,node2'
  DEPLOYMENT: 'state-restore-deployment'
  NAMESPACE: 'state-restore-namespace'

  SOLO_USER_DIR: '{{ default (printf "%s/.solo" (env "HOME")) }}'

  # Cluster Configuration
  CLUSTER_NAME: 'state-restore-cluster'
  CONTEXT: 'kind-state-restore-cluster'
  CLUSTER_REF: 'kind-state-restore-cluster'

  # State Save Configuration
  STATE_SAVE_DIR: '{{ .USER_WORKING_DIR }}/saved-states'
  ORIGINAL_NETWORK_JSON_FILE: '{{ .STATE_SAVE_DIR }}/original-network.json'
  GENERATED_OVERRIDE_NETWORK_JSON_FILE: '{{ .STATE_SAVE_DIR }}/override-network.json'
  CURRENT_SERVICE_ENDPOINTS_FILE: '{{ .STATE_SAVE_DIR }}/current-service-endpoints.json'
  OVERRIDE_NETWORK_GENERATOR_SCRIPT: '{{ .TASKFILE_DIR }}/scripts/generate-override-network.mjs'
  SAVED_KEYS_DIR: '{{ .STATE_SAVE_DIR }}/keys'
  SOLO_CACHE_KEYS_DIR: '{{ .SOLO_USER_DIR }}/cache/keys'

tasks:
  # ==================== Main Tasks ====================

  default:
    desc: Run complete workflow - setup, save state, restore, and verify
    cmds:
      - task: setup
      - cmd: echo ""
      - cmd: echo "⏳ Waiting 10 seconds for network to stabilize..."
      - cmd: sleep 10
      # must freeze network before saving state otherwise may get error "file changed as we read it"
      - task: stop-network
      - task: save-state
      - cmd: echo ""
      - cmd: echo "⏳ Waiting 10 seconds before fresh-cluster restore..."
      - cmd: sleep 10
      - task: restore
      - cmd: echo ""
      - cmd: echo "🎉 Complete workflow finished successfully!"
      - cmd: echo "Run 'task destroy' to clean up resources"

  # ==================== Setup Tasks ====================

  setup:
    desc: Deploy initial consensus network
    cmds:
      - task: create-cluster
      - task: init-solo
      - task: deploy-block-node
      - task: deploy-network
      - task: generate-transactions
      - cmd: echo "✅ Initial consensus network setup complete!"
      - cmd: echo "Run 'task save-state' to save consensus state"

  # ==================== Infrastructure Tasks ====================

  create-cluster:
    desc: Create Kind cluster
    cmds:
      - cmd: |
          if [ "${USE_RELEASED_VERSION}" = "true" ]; then
            npm i @hashgraph/solo@latest
          else
            echo "Using development version of Solo"
          fi
      - cmd: |
          SHARED_KIND_CONFIG="{{ .TASKFILE_DIR }}/../../resources/kind-config.yaml"
          if [ -f "${SHARED_KIND_CONFIG}" ]; then
            kind create cluster -n {{ .CLUSTER_NAME }} --config "${SHARED_KIND_CONFIG}"
          else
            kind create cluster -n {{ .CLUSTER_NAME }}
          fi
      - cmd: sleep 10 # Wait for control plane
      - cmd: kubectl config use-context {{ .CONTEXT }}

  init-solo:
    desc: Connect cluster reference and configure deployment
    cmds:
      - cmd: $SOLO_COMMAND cluster-ref config connect --cluster-ref {{ .CLUSTER_REF }} --context {{ .CONTEXT }} --quiet-mode
      - cmd: $SOLO_COMMAND deployment config create --namespace {{ .NAMESPACE }} --deployment {{ .DEPLOYMENT }} --realm 0 --shard 0
      - cmd: $SOLO_COMMAND deployment cluster attach --cluster-ref {{ .CLUSTER_REF }} --deployment {{ .DEPLOYMENT }} --num-consensus-nodes {{ .NETWORK_SIZE }}

  # ==================== Network Deployment Tasks ====================

  deploy-network:
    desc: Deploy consensus network
    cmds:
      - cmd: $SOLO_COMMAND keys consensus generate --gossip-keys --tls-keys --node-aliases {{ .NODE_ALIASES }} --deployment {{ .DEPLOYMENT }}
      - cmd: |
          $SOLO_COMMAND consensus network deploy --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }} \
            --enable-monitoring-support false --quiet-mode --dev
      - cmd: $SOLO_COMMAND consensus node setup --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: $SOLO_COMMAND consensus node start --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: echo "✅ Consensus network deployed with {{ .NETWORK_SIZE }} nodes"

  # ==================== Transaction Generation ====================

  generate-transactions:
    desc: Generate sample transactions to create state
    cmds:
      - cmd: echo "Generating sample transactions..."
      - cmd: |
          for i in {1..3}; do
            $SOLO_COMMAND ledger account create --deployment {{ .DEPLOYMENT }} --hbar-amount 100
            sleep 2
          done
      - cmd: echo "✅ Sample transactions completed - network state created"

  # ==================== State Save Tasks ====================

  save-state:
    desc: Download consensus node state and save restore metadata
    cmds:
      - cmd: mkdir -p {{ .STATE_SAVE_DIR }}
      - cmd: echo "Downloading state from consensus nodes..."
      - cmd: $SOLO_COMMAND consensus state download --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: |
          # Move downloaded state files to save directory
          mkdir -p "{{ .STATE_SAVE_DIR }}/{{ .NAMESPACE }}"
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            STATE_FILE="network-${node}-0-state.zip"
            if [ -f "$HOME/.solo/logs/{{ .NAMESPACE }}/${STATE_FILE}" ]; then
              cp "$HOME/.solo/logs/{{ .NAMESPACE }}/${STATE_FILE}" "{{ .STATE_SAVE_DIR }}/{{ .NAMESPACE }}/"
              echo "✅ Saved state for ${node} (${STATE_FILE})"
            else
              echo "⚠️  State file not found: $HOME/.solo/logs/{{ .NAMESPACE }}/${STATE_FILE}"
              exit 1
            fi
          done
      # Save the original roster and network metadata as the template for
      # override-network.json; the restore workflow replaces only endpoint IPs
      # with addresses from the freshly created cluster.
      - cmd: echo "Saving original network definition for endpoint override..."
      - cmd: |
          kubectl exec network-node1-0 -n {{ .NAMESPACE }} -c root-container -- bash -c '
            if [ -f /opt/hgcapp/services-hedera/HapiApp2.0/output/network.json ]; then
              cat /opt/hgcapp/services-hedera/HapiApp2.0/output/network.json
            elif [ -f /opt/hgcapp/services-hedera/HapiApp2.0/data/config/genesis-network.json ]; then
              cat /opt/hgcapp/services-hedera/HapiApp2.0/data/config/genesis-network.json
            elif [ -f /opt/hgcapp/services-hedera/HapiApp2.0/data/config/.archive/genesis-network.json ]; then
              cat /opt/hgcapp/services-hedera/HapiApp2.0/data/config/.archive/genesis-network.json
            else
              echo "No usable network JSON found in node pod" >&2
              exit 1
            fi
          ' > {{ .ORIGINAL_NETWORK_JSON_FILE }}
      - cmd: echo "✅ Source network JSON exported to {{ .ORIGINAL_NETWORK_JSON_FILE }}"
      - cmd: echo "Saving consensus node key material from Kubernetes secrets..."
      - cmd: mkdir -p {{ .SAVED_KEYS_DIR }}
      - cmd: |
          kubectl get secret network-node-hapi-app-secrets -n {{ .NAMESPACE }} -o json | \
          jq -r '.data | to_entries[] | @base64' | \
          while IFS= read -r entry; do
            key_file_name="$(printf '%s' "${entry}" | base64 --decode | jq -r '.key')"
            key_file_value="$(printf '%s' "${entry}" | base64 --decode | jq -r '.value')"
            printf '%s' "${key_file_value}" | base64 --decode > "{{ .SAVED_KEYS_DIR }}/${key_file_name}"
            chmod 600 "{{ .SAVED_KEYS_DIR }}/${key_file_name}"
            echo "✅ Saved TLS key file ${key_file_name}"
          done
      - cmd: |
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            kubectl get secret network-${node}-keys-secrets -n {{ .NAMESPACE }} -o json | \
            jq -r '.data | to_entries[] | @base64' | \
            while IFS= read -r entry; do
              key_file_name="$(printf '%s' "${entry}" | base64 --decode | jq -r '.key')"
              key_file_value="$(printf '%s' "${entry}" | base64 --decode | jq -r '.value')"
              printf '%s' "${key_file_value}" | base64 --decode > "{{ .SAVED_KEYS_DIR }}/${key_file_name}"
              chmod 600 "{{ .SAVED_KEYS_DIR }}/${key_file_name}"
              echo "✅ Saved gossip key file ${key_file_name}"
            done
          done
      - cmd: echo "✅ Network state and restore metadata saved to {{ .STATE_SAVE_DIR }}"
      - cmd: ls -lh {{ .STATE_SAVE_DIR }}

  # ==================== State Restore Tasks ====================

  restore:
    desc: Recreate a fresh cluster, restore state, and verify the saved network can boot again
    cmds:
      - task: destroy-network
      - task: destroy-cluster
      - task: create-cluster
      - task: init-solo
      - task: restore-consensus-keys
      - task: deploy-block-node
      - task: deploy-network-with-state
      - task: verify-state
      - cmd: echo "✅ Consensus network restored!"

  deploy-network-with-state:
    desc: Deploy a fresh network and start nodes from saved state with override-network endpoint remapping
    cmds:
      - cmd: echo "Deploying network with saved state..."
      - cmd: |
          echo "This workflow validates saved-state startup on a freshly recreated cluster."
          echo "It rewrites the saved roster with override-network.json so the restarted"
          echo "nodes adopt the fresh cluster's current gossip service IPs."
      - cmd: |
          $SOLO_COMMAND consensus network deploy --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: $SOLO_COMMAND consensus node setup --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: |
          echo "Waiting for recreated consensus pods to exist before restore..."
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            kubectl wait --for=create pod/network-${node}-0 -n {{ .NAMESPACE }} --timeout=300s
          done
      - task: generate-override-network
      - task: install-override-network
      - cmd: |
          # Build the directory layout expected by Solo for per-node state restore.
          RESTORE_INPUT_DIR="{{ .STATE_SAVE_DIR }}/restore-input"
          RESTORE_STATES_DIR="${RESTORE_INPUT_DIR}/states/{{ .CLUSTER_REF }}/{{ .NAMESPACE }}"
          RESTORE_ROUND=""
          rm -rf "${RESTORE_STATES_DIR}"
          mkdir -p "${RESTORE_STATES_DIR}"

          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            NODE_STATE_FILE="network-${node}-0-state.zip"
            SRC_STATE_FILE_PATH="{{ .STATE_SAVE_DIR }}/{{ .NAMESPACE }}/${NODE_STATE_FILE}"
            DEST_STATE_FILE_PATH="${RESTORE_STATES_DIR}/${NODE_STATE_FILE}"

            if [ ! -f "${SRC_STATE_FILE_PATH}" ]; then
              echo "⚠️  State file not found for ${node}: ${SRC_STATE_FILE_PATH}"
              exit 1
            fi

            cp "${SRC_STATE_FILE_PATH}" "${DEST_STATE_FILE_PATH}"
            SELECTED_ROUND="$(unzip -Z1 "${DEST_STATE_FILE_PATH}" | awk -F/ '$1 == "com.hedera.services.ServicesMain" && $4 ~ /^[0-9]+$/ {print $4}' | sort -n | tail -n 1)"
            if [ -z "${SELECTED_ROUND}" ]; then
              echo "⚠️  Could not locate the normalized state round in ${DEST_STATE_FILE_PATH}"
              exit 1
            fi

            if [ -n "${RESTORE_ROUND}" ] && [ "${RESTORE_ROUND}" != "${SELECTED_ROUND}" ]; then
              echo "⚠️  State archives do not share the same normalized round"
              exit 1
            fi
            RESTORE_ROUND="${SELECTED_ROUND}"
            echo "Prepared state for ${node}: ${DEST_STATE_FILE_PATH} (round ${SELECTED_ROUND})"
          done

          # Apply the endpoint override after the normalized snapshot round so
          # the saved state signature is verified before the fresh endpoints are
          # applied during replay.
          OVERRIDE_ROUND=$((RESTORE_ROUND + 1))
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            kubectl exec network-${node}-0 -n {{ .NAMESPACE }} -c root-container -- \
              bash -c "mkdir -p /opt/hgcapp/services-hedera/HapiApp2.0/data/config/${OVERRIDE_ROUND} && mv /opt/hgcapp/services-hedera/HapiApp2.0/data/config/override-network.json /opt/hgcapp/services-hedera/HapiApp2.0/data/config/${OVERRIDE_ROUND}/override-network.json"
            kubectl exec network-${node}-0 -n {{ .NAMESPACE }} -c root-container -- \
              ls -l /opt/hgcapp/services-hedera/HapiApp2.0/data/config/${OVERRIDE_ROUND}/override-network.json
          done

          echo "Prepared restore input:"
          find "${RESTORE_INPUT_DIR}" -maxdepth 4 -type f | sort

          # Start all nodes together so they replay the same restored boundary.
          $SOLO_COMMAND consensus node start --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }} \
            --state-file "${RESTORE_INPUT_DIR}"
      - cmd: echo "✅ Nodes started with restored state"

  restore-consensus-keys:
    desc: Restore saved consensus key material into Solo cache
    cmds:
      - cmd: |
          if [ ! -d {{ .SAVED_KEYS_DIR }} ]; then
            echo "⚠️  Saved key directory not found: {{ .SAVED_KEYS_DIR }}"
            exit 1
          fi
      - cmd: mkdir -p "{{ .SOLO_CACHE_KEYS_DIR }}"
      # The Solo key cache is shared by every deployment on the machine, so only the files
      # this example saved are written or chmod'ed; copying over them is enough to restore
      # the network and any other deployment's key material is left untouched.
      - cmd: |
          for saved_key_file in "{{ .SAVED_KEYS_DIR }}"/*; do
            cp "${saved_key_file}" "{{ .SOLO_CACHE_KEYS_DIR }}/"
            chmod 600 "{{ .SOLO_CACHE_KEYS_DIR }}/$(basename "${saved_key_file}")"
          done
      - cmd: echo "✅ Restored consensus key material to {{ .SOLO_CACHE_KEYS_DIR }}"

  generate-override-network:
    desc: Generate override-network.json using the fresh cluster service IPs
    cmds:
      - cmd: |
          if [ ! -f {{ .ORIGINAL_NETWORK_JSON_FILE }} ]; then
            echo "⚠️  Saved source network JSON not found: {{ .ORIGINAL_NETWORK_JSON_FILE }}"
            exit 1
          fi
      - cmd: |
          kubectl get service -n {{ .NAMESPACE }} -o json > {{ .CURRENT_SERVICE_ENDPOINTS_FILE }}
      - cmd: |
          node {{ .OVERRIDE_NETWORK_GENERATOR_SCRIPT }} \
            --source-network {{ .ORIGINAL_NETWORK_JSON_FILE }} \
            --services-json {{ .CURRENT_SERVICE_ENDPOINTS_FILE }} \
            --node-aliases {{ .NODE_ALIASES }} \
            --output {{ .GENERATED_OVERRIDE_NETWORK_JSON_FILE }}
      - cmd: echo "✅ Generated override-network.json at {{ .GENERATED_OVERRIDE_NETWORK_JSON_FILE }}"

  install-override-network:
    desc: Copy override-network.json into each consensus node pod
    cmds:
      - cmd: |
          if [ ! -f {{ .GENERATED_OVERRIDE_NETWORK_JSON_FILE }} ]; then
            echo "⚠️  Generated override-network.json not found: {{ .GENERATED_OVERRIDE_NETWORK_JSON_FILE }}"
            exit 1
          fi
      - cmd: |
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            kubectl cp {{ .GENERATED_OVERRIDE_NETWORK_JSON_FILE }} \
              {{ .NAMESPACE }}/network-${node}-0:/opt/hgcapp/services-hedera/HapiApp2.0/data/config/override-network.json \
              -c root-container
            kubectl exec network-${node}-0 -n {{ .NAMESPACE }} -c root-container -- \
              ls -l /opt/hgcapp/services-hedera/HapiApp2.0/data/config/override-network.json
          done
      - cmd: echo "✅ override-network.json copied to each consensus node pod"

  # ==================== Verification ====================

  verify-state:
    desc: Verify restored state without submitting transactions to a frozen network
    cmds:
      - cmd: |
          echo "Verifying restored frozen state..."
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            # platform_PlatformStatus value 6 == FREEZE_COMPLETE (see NodeStatusCodes in src/core/enumerations.ts)
            kubectl exec network-${node}-0 -n {{ .NAMESPACE }} -c root-container -- \
              sh -c 'curl -sf http://localhost:9999/metrics | grep platform_PlatformStatus | grep -v "^#" | grep -q " 6\\.0$"'
            if kubectl logs network-${node}-0 -n {{ .NAMESPACE }} -c root-container --tail=500 | grep -q "Invalid State Signature"; then
              echo "⚠️  Invalid state signature found in restored ${node} logs"
              exit 1
            fi
          done
      - cmd: echo "✅ State verification complete - both restored nodes are FREEZE_COMPLETE with no ISS"

  # ==================== Cleanup Tasks ====================

  stop-network:
    desc: Stop consensus network
    cmds:
      # freeze network before download otherwise may get error "file changed as we read it"
      - cmd: echo "Freezing network..."
      - cmd: $SOLO_COMMAND consensus network freeze --deployment {{ .DEPLOYMENT }}
      - cmd: echo "✅ Network frozen"

  destroy-network:
    desc: Destroy block node and consensus network while keeping cluster configuration
    cmds:
      - cmd: echo "Destroying block node and consensus network..."
      - cmd: $SOLO_COMMAND block node destroy --deployment {{ .DEPLOYMENT }} --force || true
      - cmd: $SOLO_COMMAND consensus node stop --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }} || true
      - cmd: $SOLO_COMMAND consensus network destroy --deployment {{ .DEPLOYMENT }} --force -q || true
      - cmd: echo "✅ Network resources destroyed"

  destroy:
    desc: Destroy cluster and clean up all resources
    cmds:
      - task: destroy-network
      - task: destroy-cluster
      - task: clean-state

  destroy-cluster:
    desc: Delete the Kind cluster
    cmds:
      - cmd: kind delete cluster --name {{ .CLUSTER_NAME }} || true
      - cmd: echo "✅ Cluster destroyed"

  clean-state:
    desc: Remove saved state files
    cmds:
      - cmd: rm -rf {{ .STATE_SAVE_DIR }}
      - cmd: echo "✅ Saved state files removed"

  deploy-block-node:
    desc: Deploy block node so CN v0.74 does not require MinIO-backed stream storage
    cmds:
      - cmd: $SOLO_COMMAND block node add --deployment {{ .DEPLOYMENT }} --quiet-mode --dev
      - cmd: echo "✅ Block node deployed"
