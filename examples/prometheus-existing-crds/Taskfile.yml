version: "3"

env:
  SOLO_COMMAND:
    sh: |
      if [ "${USE_RELEASED_VERSION}" = "true" ]; then
        echo "npx @hashgraph/solo"
      else
        echo "npm run solo --"
      fi

vars:
  SOLO_CLUSTER_NAME: "{{default \"solo-prom-crds\" .SOLO_CLUSTER_NAME}}"
  SOLO_CLUSTER_SETUP_NAMESPACE: "{{default \"solo-setup\" .SOLO_CLUSTER_SETUP_NAMESPACE}}"
  SOLO_HOME: "{{default (printf \"%s/.solo\" .HOME) .SOLO_HOME}}"
  PROMETHEUS_STACK_VERSION: "{{default \"52.0.1\" .PROMETHEUS_STACK_VERSION}}"
  CRD_MANAGER: "{{default \"argocd-controller\" .CRD_MANAGER}}"

tasks:
  default:
    desc: "Pre-own the Prometheus CRDs with another field manager, then run cluster setup with --prometheus-stack"
    cmds:
      - task: create-cluster
      - task: preinstall-crds
      - task: setup
      - task: verify
      - task: destroy

  create-cluster:
    desc: "Create a kind cluster"
    cmds:
      - kind create cluster -n {{.SOLO_CLUSTER_NAME}}
      - rm -rf "{{.SOLO_HOME}}"

  preinstall-crds:
    desc: "Server-side apply the kube-prometheus-stack CRDs as another field manager (simulates ArgoCD, issue #6201)"
    cmds:
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
      - |
        # Alter controller-gen version so Helm's later apply conflicts with the existing owner on that field.
        helm show crds prometheus-community/kube-prometheus-stack --version {{.PROMETHEUS_STACK_VERSION}} \
          | sed 's#controller-gen.kubebuilder.io/version: .*#controller-gen.kubebuilder.io/version: v0.0.0-preowned#' \
          | kubectl --context kind-{{.SOLO_CLUSTER_NAME}} apply --server-side --force-conflicts \
              --field-manager={{.CRD_MANAGER}} -f -

  setup:
    desc: "Run cluster setup with Prometheus stack; failed with a CRD conflict before the fix"
    cmds:
      - |
        $SOLO_COMMAND cluster-ref config connect --cluster-ref kind-{{.SOLO_CLUSTER_NAME}} --context kind-{{.SOLO_CLUSTER_NAME}}
        $SOLO_COMMAND cluster-ref config setup -s {{.SOLO_CLUSTER_SETUP_NAMESPACE}} --prometheus-stack true

  verify:
    desc: "Assert the release is deployed and the pre-existing CRDs are still owned by the other manager"
    cmds:
      - helm --kube-context kind-{{.SOLO_CLUSTER_NAME}} -n {{.SOLO_CLUSTER_SETUP_NAMESPACE}} status kube-prometheus-stack
      - |
        kubectl --context kind-{{.SOLO_CLUSTER_NAME}} get crd alertmanagerconfigs.monitoring.coreos.com \
          -o jsonpath='{.metadata.annotations.controller-gen\.kubebuilder\.io/version}' | grep -q 'v0.0.0-preowned'

  destroy:
    desc: "Delete the kind cluster"
    cmds:
      - kind delete cluster -n {{.SOLO_CLUSTER_NAME}}
