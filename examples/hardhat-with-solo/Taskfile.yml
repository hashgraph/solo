version: 3

env:
  SOLO_COMMAND:
    sh: |
      if [ "${USE_RELEASED_VERSION}" = "true" ]; then
        echo "npx @hashgraph/solo"
      else
        echo "npm run solo --"
      fi

vars:
  foo: 'bar'

tasks:
  deploy:
    desc: Deploy a complete Hiero network using one-shot single deploy
    env:
      ONE_SHOT_WITH_BLOCK_NODE: '{{default "true" .ONE_SHOT_WITH_BLOCK_NODE}}'
    cmds:
      # Install Solo CLI
      - cmd: |
          if [ "${USE_RELEASED_VERSION}" = "true" ]; then
            npm i @hashgraph/solo@latest
          else
            echo "Skipping npm install - using development version"
          fi

      # Create a Solo Deployment
      - cmd: $SOLO_COMMAND one-shot single deploy

      # Verify the active deployment reports the static one-shot ports
      - cmd: |
          output="$($SOLO_COMMAND deployment config info --deployment one-shot 2>&1)"
          printf '%s\n' "$output"

          required_entries=(
            "localhost:35211 -> pod:30007 [Running]"
            "localhost:38081 -> pod:30003 [Running]"
            "localhost:37546 -> pod:30006 [Running]"
            "localhost:38080 -> pod:30005 [Running]"
          )

          for expected in "${required_entries[@]}"; do
            printf '%s\n' "$output" | grep -F -- "$expected" >/dev/null || {
              echo "Expected one-shot port status entry not found: $expected"
              exit 1
            }
          done

          printf '%s\n' "$output" | grep -F "Running: 4 / 4" >/dev/null || {
            echo "Expected one-shot deployment summary to show 4/4 running port-forwards"
            exit 1
          }

      - cmd: |
          cd hardhat-example
          npm install
          npx hardhat compile
          npx hardhat test --network my_solo_deployment

  destroy:
    desc: Destroy the Solo network using one-shot single destroy
    env:
      ONE_SHOT_WITH_BLOCK_NODE: '{{default "true" .ONE_SHOT_WITH_BLOCK_NODE}}'
    cmds:
      # Solo one-shot single destroy
      - cmd: $SOLO_COMMAND one-shot single destroy

  default:
    desc: Run the default deploy task
    cmds:
      - task: deploy
