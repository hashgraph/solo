# Solo-owned configuration for the Homebrew-installed rootful podman on Linux.
#
# Rootful podman otherwise reads /etc/containers and resolves its OCI runtime and helper binaries
# from absolute system paths, so on a host carrying an older container stack the brew podman would
# run a crun/netavark it cannot work with. Every path below points at the Homebrew stack or at the
# helpers Solo downloads itself, keeping the system container configuration untouched.

[engine]
runtime = "crun"
conmon_path = ["$CONMON_PATH"]
helper_binaries_dir = ["$HELPER_BINARIES_DIR", "$PODMAN_BINARY_DIR", "/usr/libexec/podman", "/usr/lib/podman"]

[engine.runtimes]
crun = ["$CRUN_PATH"]
