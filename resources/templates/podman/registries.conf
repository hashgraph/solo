# Solo-owned v2 registries configuration for the Homebrew-installed rootful podman on Linux.
#
# podman 5+ refuses to load a v1-format registries.conf at all, and hosts that carried an older
# container stack often still have one under /etc/containers. kind pulls its node image by short
# name, which only resolves through unqualified-search-registries.
unqualified-search-registries = ["docker.io"]
