# Values for the standalone kube-prometheus-stack install; previously supplied by the solo-cluster-setup umbrella chart
prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true # Grafana Alloy remote-writes consensus node metrics to Prometheus
    scrapeInterval: 5s
    podMonitorNamespaceSelector: {} # empty label selector matches all namespaces
    podMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {} # empty label selector matches all namespaces
    ruleSelector: {}
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {} # empty label selector matches all namespaces
    serviceMonitorSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
