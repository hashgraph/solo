# Loki log store installed by `solo cluster-ref config setup --grafana-alloy`.
# Runs the smallest footprint the chart supports: one single-binary replica with
# filesystem storage and every auxiliary workload (gateway, caches, canary) disabled.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  # Bound the log volume on the single 10Gi data volume: the embedded compactor deletes chunks
  # older than the retention period instead of letting consensus node logs fill the disk.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 168h

singleBinary:
  replicas: 1

# The simple-scalable targets must be pinned to zero replicas in SingleBinary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
