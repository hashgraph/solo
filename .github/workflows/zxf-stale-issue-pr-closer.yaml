name: 'ZXF: Stale Issue/PR Closer'

on:
  # Run at 00:15 UTC every day, no need to run too frequently
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  stale-pull-requests:
    name: Stale Pull Requests
    runs-on: hiero-solo-linux-medium
    permissions:
      contents: write # actions/stale deletes the head branch (delete-branch: true)
      pull-requests: write # actions/stale labels, comments on and closes pull requests
      issues: write # actions/stale documents it for label mutation via the issues endpoint
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Close Stale Pull Requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          enable-statistics: true
          delete-branch: true
          days-before-issue-stale: -1
          days-before-pr-stale: 14
          days-before-issue-close: -1
          days-before-pr-close: 14
          stale-pr-message: 'This pull request is stale because it has been open 14 days with no activity. Remove stale label or comment on this pull request; otherwise, this pull request will be closed in 14 days.'
          close-pr-message: 'This pull request was closed because it has been stalled for 14 days with no activity.'

