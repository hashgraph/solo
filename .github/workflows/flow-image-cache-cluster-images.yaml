name: 'Image Cache: Capture Cluster Images'
# Lists the images a clean one-shot deploy runs and exports each one as an image cache archive.

on:
  workflow_call:
    inputs:
      version:
        description: 'Solo version the image list is captured for, for example 0.92.0 (default: the package.json version)'
        type: string
        required: false
        default: ''
  # Run manually against a branch (gh workflow run flow-image-cache-cluster-images.yaml --ref <branch>) to test
  # changes; it is too slow to run on every pull request push.
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  STEP_TIMEOUT_MINUTES: '5'
  # Kind's own namespaces; their images ship in the Kind node image.
  KIND_SYSTEM_NAMESPACES: 'kube-system local-path-storage'
  CRANE_VERSION: 'v0.21.4'
  CRANE_SHA256: '3b6032bcf412e14cf3baf964a4065f2966af906ec947ab22478df5f74705c892'
  # The platforms the image cache archives are exported for: Linux and Windows hosts run amd64 Kind nodes,
  # Apple Silicon Macs run arm64 ones.
  IMAGE_CACHE_PLATFORMS: 'linux/amd64 linux/arm64'

jobs:
  capture-cluster-images:
    name: Capture Cluster Images
    runs-on: hiero-solo-linux-large
    timeout-minutes: 90
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Compile Project
        timeout-minutes: 10
        run: task build:compile

      - name: Assert Clean Environment
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          if [[ -e ~/.solo ]]; then
            echo "::error::~/.solo exists; the runner is not clean"
            exit 1
          fi
          if command -v kind >/dev/null 2>&1 && [[ -n "$(kind get clusters 2>/dev/null)" ]]; then
            echo "::error::Kind clusters already exist: $(kind get clusters | tr '\n' ' ')"
            exit 1
          fi
          echo "Environment is clean."

      - name: One-Shot Single Deploy
        timeout-minutes: 70
        env:
          ENABLE_IMAGE_CACHE: 'false'
        run: |
          export PATH=~/.solo/bin:${PATH}
          npm run solo -- one-shot single deploy --dev

      - name: Capture Cluster Images
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          set -euo pipefail
          export PATH=~/.solo/bin:${PATH}
          mkdir -p cluster-images
          kubectl get pods --all-namespaces -o json > cluster-images/pods.json
          jq -r --arg excluded "${KIND_SYSTEM_NAMESPACES}" '
            ($excluded | split(" ")) as $excludedNamespaces
            | .items[]
            | select(.metadata.namespace as $namespace | $excludedNamespaces | index($namespace) | not)
            | (.spec.initContainers // []) + .spec.containers
            | .[].image
          ' cluster-images/pods.json | sort -u > cluster-images/images.txt
          # Pair each container's image with the digest the cluster ran, for the archive export.
          jq -r --arg excluded "${KIND_SYSTEM_NAMESPACES}" '
            ($excluded | split(" ")) as $excludedNamespaces
            | .items[]
            | select(.metadata.namespace as $namespace | $excludedNamespaces | index($namespace) | not)
            | ((.status.initContainerStatuses // []) + (.status.containerStatuses // [])) as $statuses
            | (.spec.initContainers // []) + .spec.containers
            | .[]
            | . as $container
            | "\($container.image)\t\(first($statuses[] | select(.name == $container.name) | .imageID) // "")"
          ' cluster-images/pods.json | sort -u > cluster-images/images.tsv
          rm cluster-images/pods.json

          if [[ ! -s cluster-images/images.txt ]]; then
            echo "::error::no container images found in the cluster after deploy"
            exit 1
          fi
          echo "Captured $(wc -l < cluster-images/images.txt) images:"
          cat cluster-images/images.txt

      - name: Upload Cluster Images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          name: image-cache-cluster-images
          path: cluster-images/images.txt
          if-no-files-found: error

      - name: Collect Diagnostics on Failure
        if: ${{ failure() }}
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          export PATH=~/.solo/bin:${PATH}
          npm run solo -- deployment diagnostics logs -q --dev || true

      - name: One-Shot Single Destroy
        if: always()
        timeout-minutes: 15
        run: |
          export PATH=~/.solo/bin:${PATH}
          npm run solo -- one-shot single destroy --quiet-mode --dev || true

      - name: Install Crane
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/go-containerregistry.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "${archive}" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" crane
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Export Image Cache Archives
        timeout-minutes: 30
        env:
          KIND_DOCKER_REGISTRY_MIRRORS: ${{ vars.KIND_DOCKER_REGISTRY_MIRRORS }}
        run: .github/workflows/script/image_cache_export.sh cluster-images/images.tsv image-cache

      - name: Upload Image Cache Index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          name: image-cache-index
          path: |
            image-cache/image-cache-images.json
            image-cache/*.sha256
          if-no-files-found: error

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          name: image-cache-cluster-images-logs
          path: ~/.solo/logs/*
          overwrite: true
          if-no-files-found: warn

      # Cleanup
      - name: Remove Image Cache Archives
        if: always()
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: rm -rf image-cache
