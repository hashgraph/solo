name: "Solo Docs Update Trigger"

on:
  # workflow_run runs in the base repository context with access to secrets, which is dangerous when
  # a workflow consumes artifacts from the triggering run or checks out the code that produced them.
  # This workflow does neither: it downloads no artifacts, has no actions/checkout step, and only
  # dispatches a workflow in hiero-ledger/solo-docs once "Deploy Release Artifact" — itself limited
  # to trusted refs — has completed successfully.
  # Take care before adding a checkout or artifact download here: secrets.GH_ACCESS_TOKEN is a PAT
  # and is already in scope, so either addition would turn this into a genuine privilege-escalation
  # path. If this workflow ever needs the triggering run's output, switch to repository_dispatch.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - "Deploy Release Artifact"
    types:
      - completed

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  trigger-solo-docs-update:
    name: Trigger Solo Docs Update
    runs-on: hiero-solo-linux-medium
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Trigger Solo Docs Workflow
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          gh workflow run flow-update-docs.yaml --repo hiero-ledger/solo-docs
          echo "::notice::Triggered solo-docs update"
