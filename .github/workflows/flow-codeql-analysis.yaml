# CodeQL static analysis (SAST) of the TypeScript sources and the GitHub
# Actions workflows, using the security-extended query suite. Results appear
# under the repository Security tab.
#
# Runs on every pull request and push to main/release branches — intentionally
# without path filters, since the OpenSSF Scorecard SAST check scores by the
# fraction of commits that had a SAST run (https://scorecard.dev/viewer/?uri=github.com/hiero-ledger/solo).
# Also runs once daily at 04:28 UTC against main, so new and improved CodeQL
# queries re-scan the existing code between commits.
name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'
  schedule:
    - cron: '28 4 * * *'

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: hiero-solo-linux-medium
    timeout-minutes: 60
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CodeQL TypeScript extractor requires Node.js on the PATH, which the
      # self-hosted runners do not provide by default.
      #
      # setup-node caches npm downloads, and this workflow runs on both pull_request and push to
      # main, so in principle a pull request run could populate a cache that a later trusted run
      # restores. The risk is accepted here (issue #5957) because no release artifact is produced.
      # Note this is the sharpest instance of the audit in this repository: a poisoned cache in a
      # security scanner could suppress findings, so revisit this if CodeQL results ever become a
      # release gate rather than advisory.
      - name: Setup Node
        if: ${{ matrix.language == 'javascript-typescript' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
