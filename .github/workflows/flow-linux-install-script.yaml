# Tests the Linux install script (installers/linux/install.sh) on every supported distribution:
# the script-logic harness with a stand-in binary, then a real install of the SEA binary built in
# this run for the runner's architecture, served from a local release directory over file://.
# Tracked by hiero-ledger/solo#5725.
name: 'Linux Install Script'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'installers/linux/**'
      - 'sea/**'
      - '.github/workflows/flow-linux-install-script.yaml'

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-sea:
    name: 'Build SEA (linux-${{ matrix.arch }})'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: hiero-solo-linux-medium
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npx tsc

      - name: Build SEA Binary
        run: npx tsx sea/build.ts

      - name: Upload SEA Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solo-linux-${{ matrix.arch }}
          path: sea/dist/solo-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  install-script:
    name: "Install Script (${{ matrix.distro }}${{ matrix.arch == 'arm64' && ', arm64' || '' }})"
    needs: build-sea
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    env:
      SEA_ASSET: solo-linux-${{ matrix.arch || 'x64' }}
    strategy:
      fail-fast: false
      matrix:
        # Same distributions as flow-install-validation.yaml. `bootstrap` adds what checkout and the
        # script need; `libc` selects whether the SEA binary is expected to install. Rows without
        # `arch` and `runner` test x64 on ubuntu-latest.
        include:
          - distro: ubuntu
            image: ubuntu:24.04
            bootstrap: 'apt-get update && apt-get install -y git curl ca-certificates'
            libc: glibc
          - distro: debian
            image: debian:12
            bootstrap: 'apt-get update && apt-get install -y git curl ca-certificates'
            libc: glibc
          - distro: fedora
            image: fedora:44
            bootstrap: 'dnf install -y --allowerasing git curl ca-certificates tar gzip'
            libc: glibc
          - distro: rocky
            image: quay.io/rockylinux/rockylinux:9
            bootstrap: 'dnf install -y --allowerasing git curl ca-certificates tar gzip'
            libc: glibc
          - distro: alma
            image: almalinux:9
            bootstrap: 'dnf install -y --allowerasing git curl ca-certificates tar gzip'
            libc: glibc
          - distro: oraclelinux
            image: oraclelinux:9
            bootstrap: 'dnf install -y --allowerasing git curl ca-certificates tar gzip'
            libc: glibc
          - distro: opensuse
            image: opensuse/leap:16.0
            bootstrap: 'zypper --non-interactive install git curl ca-certificates tar gzip'
            libc: glibc
          # Rolling release, so the tag cannot be pinned; the accepted exception is tracked in #5957.
          - distro: arch
            image: archlinux:latest
            bootstrap: 'pacman -Syu --noconfirm --needed git curl ca-certificates'
            libc: glibc
          # GNU tar is required because busybox tar cannot serve the actions that unpack downloads.
          - distro: alpine
            image: alpine:3.21
            bootstrap: 'apk update && apk add git curl ca-certificates tar'
            libc: musl
          # arm64: the oldest glibc in this set (EL9) and Ubuntu. There is no musl binary yet (#6211),
          # and the x64 alpine row already covers that rejection.
          - distro: ubuntu
            image: ubuntu:24.04
            bootstrap: 'apt-get update && apt-get install -y git curl ca-certificates'
            libc: glibc
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: rocky
            image: quay.io/rockylinux/rockylinux:9
            bootstrap: 'dnf install -y --allowerasing git curl ca-certificates tar gzip'
            libc: glibc
            arch: arm64
            runner: ubuntu-24.04-arm
    container:
      # The arch row intentionally uses a floating 'latest' tag; see the comment on that row.
      image: ${{ matrix.image }} # zizmor: ignore[unpinned-images]
      # Some images declare no PATH (see flow-install-validation.yaml), so declare the standard one.
      env:
        PATH: '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
    defaults:
      run:
        # The script under test is POSIX sh, and Alpine has no bash.
        shell: sh
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Bootstrap Container
        run: ${{ matrix.bootstrap }}

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Install Script Logic
        run: sh installers/linux/test-install.sh

      - name: Download SEA Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.SEA_ASSET }}
          path: sea-binary

      - name: Stage Local Release
        run: |
          set -eu
          release_directory="${RUNNER_TEMP}/release/latest/download"
          mkdir -p "${release_directory}"
          cp "sea-binary/${SEA_ASSET}" "${release_directory}/${SEA_ASSET}"
          cd "${release_directory}"
          sha256sum "${SEA_ASSET}" >SHA256SUMS

      - name: Install SEA Binary
        if: matrix.libc == 'glibc'
        run: |
          set -eu
          sh installers/linux/install.sh --base-url "file://${RUNNER_TEMP}/release" --skip-image-cache
          expected_version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"
          actual_version="$("${HOME}/.solo/bin/solo" --version)"
          echo "installed: ${actual_version}"
          echo "${actual_version}" | grep -qF "${expected_version}"

      - name: Reject Missing musl Binary
        if: matrix.libc == 'musl'
        run: |
          set -eu
          if sh installers/linux/install.sh --base-url "file://${RUNNER_TEMP}/release" --skip-image-cache 2>install.log; then
            echo 'expected the install to fail: the release has no musl binary'
            exit 1
          fi
          cat install.log
          grep -qF "no Solo binary for this machine (${SEA_ASSET}-musl)" install.log

  one-shot:
    name: 'Install and One-Shot (ubuntu)'
    needs: build-sea
    # Same runner as the clean-environment job in flow-standard-runner-one-shot.yaml: the image
    # cache and the cluster both need the disk.
    runs-on: hiero-solo-linux-large
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Only the script is checked out, so solo runs outside a source tree, as on a user's machine.
      - name: Checkout Install Script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: installers/linux/install.sh
          sparse-checkout-cone-mode: false

      - name: Download SEA Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solo-linux-x64
          path: sea-binary

      - name: Stage Local Release
        run: |
          release_directory="${RUNNER_TEMP}/release/latest/download"
          mkdir -p "${release_directory}"
          mv sea-binary/solo-linux-x64 "${release_directory}/solo-linux-x64"
          cd "${release_directory}"
          sha256sum solo-linux-x64 >SHA256SUMS

      # Installer users have no Node.js, so the runner's copy is removed. JavaScript actions keep
      # working: they run on the runner's own bundled Node.js.
      - name: Assert Clean Environment
        run: |
          if command -v node; then
            sudo rm "$(command -v node)"
          fi
          for tool in node solo; do
            if command -v "${tool}"; then
              echo "NOT CLEAN: ${tool} is on PATH"
              exit 1
            fi
          done
          if [ -e ~/.solo ]; then
            echo 'NOT CLEAN: ~/.solo exists'
            exit 1
          fi

      # Opt into image prefetch so this lane covers cache population as well as installation.
      - name: Install Solo
        run: |
          sh installers/linux/install.sh --base-url "file://${RUNNER_TEMP}/release" --with-image-cache
          echo "${HOME}/.solo/bin" >>"${GITHUB_PATH}"

      # install.sh only warns when the pull fails, so check the cache here. The pull needs the
      # release's cache-manifest.json, which no release publishes yet (#5747). Until then the check
      # is skipped with a warning; it turns strict on its own once the manifest exists.
      - name: Verify Image Cache
        run: |
          version="$(solo --version | sed -n 's/^Version[[:space:]]*:[[:space:]]*//p' | head -n 1)"
          test -n "${version}"
          manifest_url="https://github.com/hiero-ledger/solo/releases/download/v${version}/cache-manifest.json"
          if ! curl -fsIL -o /dev/null "${manifest_url}"; then
            echo "::warning::${manifest_url} is not published, so the image cache is not checked"
            exit 0
          fi
          solo cache image status | tee image-cache-status.log
          grep -qF 'Healthy: true' image-cache-status.log

      - name: One-Shot Single Deploy
        timeout-minutes: 70
        run: solo one-shot single deploy --dev

      - name: Verify Mirror REST API
        timeout-minutes: 10
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:38081/api/v1/accounts | grep -q '"accounts"'; then
              echo 'Mirror REST API returned accounts.'
              exit 0
            fi
            echo "Attempt ${attempt}/30: not ready yet, retrying in 10s..."
            sleep 10
          done
          echo 'ERROR: Mirror REST API did not return accounts after 5 minutes.'
          exit 1

      - name: Collect Diagnostics on Failure
        if: ${{ failure() }}
        timeout-minutes: 5
        run: solo deployment diagnostics logs -q --dev || true

      # Not `|| true`: a failed destroy fails the job, since the full lifecycle is under test.
      - name: One-Shot Single Destroy
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: solo one-shot single destroy --quiet-mode --dev

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-installer-one-shot-logs
          path: ~/.solo/logs/*
          if-no-files-found: warn
