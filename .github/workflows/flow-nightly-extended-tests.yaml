# Night test checks some non critical functions or features not captured by PR tests
# or Example tests, such as JVM Debugger

name: "Nightly Extended Tests"

on:
  schedule:
    # Run every weekday at 6 AM UTC (covers Central Daylight Time)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      node-version:
        description: "NodeJS Version:"
        type: string
        required: false
        default: "24"

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  STEP_TIMEOUT_MINUTES: '5'
  # Tools are downloaded directly and verified against these pinned linux/amd64 checksums.
  JQ_VERSION: 'jq-1.8.2'
  JQ_SHA256: 'b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f'
  KUBECTL_VERSION: 'v1.31.4'
  KUBECTL_SHA256: '298e19e9c6c17199011404278f0ff8168a7eca4217edad9097af577023a5620f'
  KIND_VERSION: 'v0.26.0'
  KIND_SHA256: 'd445b44c28297bc23fd67e51cc24bb294ae7b977712be2d4d312883d0835829b'

jobs:
  build-sea:
    name: Build SEA Binaries
    uses: $/.github/workflows/flow-build-sea.yaml
    with:
      node-version: ${{ inputs.node-version || '24' }}

  prepare-setup:
    name: Prepare Setup
    runs-on: hiero-solo-linux-medium
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          node-version: ${{ inputs.node-version || '24' }}
          cache: npm

      - name: Configure npm registry
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: echo "registry=https://registry.npmjs.org/" > .npmrc

      - name: Install Dependencies
        uses: step-security/retry@38808b4332b98bb36ca031abff0c100231608288 # v4.0.0
        with:
          max_attempts: 10
          timeout_minutes: 10
          command: npm ci

  generate_matrix:
    runs-on: hiero-solo-linux-medium
    needs:
      - prepare-setup
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}

      - name: Install jq
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/bin/jq" \
            "https://github.com/jqlang/jq/releases/download/${JQ_VERSION}/jq-linux-amd64"
          echo "${JQ_SHA256}  ${RUNNER_TEMP}/bin/jq" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/bin/jq"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Read JSON and Set Matrix Output
        id: set_matrix
        run: |
          # Read script-only test array for matrix runner.
          JSON_CONTENT=$(jq -c '.tests | map(select(.type == "script"))' .github/workflows/support/extended-test-matrix.json)

          echo "JSON_CONTENT: $JSON_CONTENT"

          # Set workflow outputs.
          echo "matrix=$JSON_CONTENT" >> $GITHUB_OUTPUT

  matrix-tests:
    name: Extended Test (${{ matrix.test.name }})
    runs-on: hiero-solo-linux-large
    needs:
      - generate_matrix
    timeout-minutes: ${{ matrix.test.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.generate_matrix.outputs.matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          node-version: ${{ inputs.node-version || '24' }}
          cache: npm

      - name: Configure npm registry
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: echo "registry=https://registry.npmjs.org/" > .npmrc

      - name: Install Dependencies
        uses: step-security/retry@38808b4332b98bb36ca031abff0c100231608288 # v4.0.0
        with:
          max_attempts: 10
          timeout_minutes: 10
          command: npm ci

      - name: Install jq, Kubectl and Kind
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          TOOL_DIRECTORY="${RUNNER_TEMP}/bin"
          mkdir -p "${TOOL_DIRECTORY}"

          install_tool() {
            local name="$1" url="$2" sha256="$3"
            curl -fsSL --retry 5 --retry-all-errors -o "${TOOL_DIRECTORY}/${name}" "${url}"
            echo "${sha256}  ${TOOL_DIRECTORY}/${name}" | sha256sum -c -
            chmod +x "${TOOL_DIRECTORY}/${name}"
          }

          install_tool jq "https://github.com/jqlang/jq/releases/download/${JQ_VERSION}/jq-linux-amd64" "${JQ_SHA256}"
          install_tool kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" "${KUBECTL_SHA256}"
          install_tool kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" "${KIND_SHA256}"
          echo "${TOOL_DIRECTORY}" >> "${GITHUB_PATH}"

      - name: Restore Solo Image Cache
        id: solo-image-cache
        if: ${{ !cancelled() && !failure() }}
        uses: $/.github/actions/solo-image-cache
        with:
          operation: restore
          key-suffix: ${{ hashFiles('version.ts', 'version-test.ts', 'resources/config/solo-cache-images-target.yaml') }}

      - name: Run Test (${{ matrix.test.name }})
        timeout-minutes: ${{ matrix.test.timeout_minutes }}
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN != '' && secrets.GH_ACCESS_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN != '' && secrets.GH_ACCESS_TOKEN || github.token }}
          TEST_NAME: ${{ matrix.test.name }}
          TEST_DESCRIPTION: ${{ matrix.test.description }}
        run: |
          echo "Running test: ${{ matrix.test.name }}"
          echo "Description: ${{ matrix.test.description }}"
          echo "Type: ${{ matrix.test.type }}"
          echo "Path: ${{ matrix.test.path }}"

          echo "Executing script: ${{ matrix.test.path }}"
          if [ -f "${{ matrix.test.path }}" ]; then
            chmod +x "${{ matrix.test.path }}"
            "${{ matrix.test.path }}"
          else
            echo "Error: Script file not found at ${{ matrix.test.path }}"
            exit 1
          fi

      - name: Save Solo Image Cache
        if: ${{ github.event_name != 'pull_request' && steps.solo-image-cache.outputs.cache-hit != 'true' && !cancelled() && !failure() }}
        uses: $/.github/actions/solo-image-cache
        with:
          operation: save
          key-suffix: ${{ hashFiles('version.ts', 'version-test.ts', 'resources/config/solo-cache-images-target.yaml') }}

      - name: Cleanup Kind Clusters
        if: ${{ always() }}
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          echo "Cleaning up clusters for test: ${{ matrix.test.name }}"
          for cluster in $(kind get clusters 2>/dev/null); do
            echo "Deleting cluster: $cluster"
            kind delete cluster -n "$cluster" || true
          done
          rm -rf ~/.solo

      - name: Send Slack Notification on Failure
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() && failure() }}
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_TEST_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_TITLE: Nightly Extended Test Failed - ${{ matrix.test.name }}
          SLACK_MESSAGE: |
            *Test:* ${{ matrix.test.name }}
            *Description:* ${{ matrix.test.description }}
            *Type:* ${{ matrix.test.type }}
            *Branch:* `${{ github.ref_name }}`
            *Commit:* ${{ github.sha }}

            :link: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Job Logs>
          SLACK_FOOTER: ${{ github.workflow }}

      - name: Upload Logs to GitHub
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          name: solo-logs-${{ matrix.test.name }}
          path: |
            ~/.solo/logs/*
            /tmp/solo-node-start.log
            /tmp/solo-jdwp-probe.log
            /tmp/solo-${{ matrix.test.name }}*.log
          if-no-files-found: ignore

  one-shot-timing:
    name: Extended Test (one-shot-timing)
    needs:
      - generate_matrix
    uses: $/.github/workflows/flow-one-shot-timing.yaml
    secrets:
      SLACK_TEST_WEBHOOK: ${{ secrets.SLACK_TEST_WEBHOOK }}

  ledger-reset-warm-start-timing:
    name: Extended Test (ledger-reset-warm-start-timing)
    needs:
      - generate_matrix
    uses: $/.github/workflows/flow-ledger-reset-warm-start-timing.yaml
    secrets:
      SLACK_TEST_WEBHOOK: ${{ secrets.SLACK_TEST_WEBHOOK }}

  flow-performance-test:
    name: Extended Test (flow-performance-test)
    permissions:
      contents: read
      actions: read # flow-performance-test.yaml polls the current workflow run
    needs:
      - generate_matrix
    # Only the nightly Slack webhook is passed explicitly; secrets.GITHUB_TOKEN is provided to
    # called workflows automatically and cannot be passed here.
    uses: $/.github/workflows/flow-performance-test.yaml
    with:
      cn-edge-version: v0.76.4
      report-to-slack: true
    secrets:
      SLACK_TEST_WEBHOOK: ${{ secrets.SLACK_TEST_WEBHOOK }}

  windows-one-shot-redeployment:
    name: Extended Test (windows-one-shot-redeployment)
    needs:
      - generate_matrix
    uses: $/.github/workflows/flow-standard-runner-one-shot-windows.yaml
    with:
      run-twice: true
    # The called workflow only uses the automatically provided GITHUB_TOKEN;
    # forwarding every repository secret is unnecessary and unsafe.
