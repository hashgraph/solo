version: '3'
# This Taskfile handles release packaging tasks.
# It can be used in CI/CD pipelines or run locally.
# Example usage:
# task -t scripts/Taskfile.release.yml pack DRY_RUN=true OUTPUT_DIR=output/hl

tasks:
  pack:
    desc: Install dependencies, build, and pack the npm package
    dir: '{{.TASKFILE_DIR}}/..'
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "output/hl"}}'
      DRY_RUN: '{{.DRY_RUN | default "false"}}'
    cmds:
      - npm ci
      - npx eslint . --fix
      - task build
      - mkdir -p "{{.OUTPUT_DIR}}"
      - |
        FLAGS=""
        if [ "{{.DRY_RUN}}" == "true" ]; then
          FLAGS="--dry-run"
        fi
        npm pack --pack-destination "{{.OUTPUT_DIR}}" ${FLAGS}
