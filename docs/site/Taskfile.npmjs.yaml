version: 3
tasks:
  npmjs:latest:solo:version:
    desc: "Display the latest version of the Solo CLI from https://www.npmjs.com/package/@hiero-ledger/solo"
    silent: true
    cmds:
      - |
        LATEST_VERSION=$(npm view @hiero-ledger/solo version)
        echo "Latest version of Solo CLI from https://www.npmjs.com/package/@hiero-ledger/solo: $LATEST_VERSION"
        mkdir -p build
        echo -n "v$LATEST_VERSION" > build/npmjs-latest-version.txt

  npmjs:list:solo:versions:
    desc: Fetch and display all versions of Solo (@hashgraph/solo and @hiero-ledger/solo) from NPM (with 'v' prefix)
    silent: true
    cmds:
      - |
        if ! command -v curl &> /dev/null; then
          echo "Error: curl is not installed." >&2
          exit 1
        fi
        if ! command -v jq &> /dev/null; then
          echo "Error: jq is not installed." >&2
          exit 1
        fi
        if ! sort -V < /dev/null &> /dev/null; then
          echo "Error: sort -V is not supported on this system." >&2
          echo "Tip: On macOS, run 'brew install coreutils' and replace 'sort' with 'gsort' in this task." >&2
          exit 1
        fi
        # Releases before 0.57.0 exist only under @hashgraph/solo and releases after the
        # dual-publish window only under @hiero-ledger/solo, so list the union of both.
        versions=""
        for pkg in @hashgraph/solo @hiero-ledger/solo; do
          echo "Fetching versions of ${pkg} from NPM..."
          response=$(curl -s "https://registry.npmjs.org/${pkg}")
          if [ $? -ne 0 ]; then
            echo "Error: Failed to fetch data from NPM registry." >&2
            exit 1
          fi
          pkg_versions=$(echo "$response" | jq -r '.versions | keys[] | "v\(.)"' 2> /dev/null)
          if [ $? -ne 0 ]; then
            echo "Error: Failed to parse JSON response." >&2
            exit 1
          fi
          versions=$(printf '%s\n%s' "$versions" "$pkg_versions")
        done
        versions=$(echo "$versions" | sed '/^$/d' | sort -Vru)
        if [ -z "$versions" ]; then
          echo "No versions found for Solo." >&2
          exit 1
        fi
        echo "Available versions of Solo:"
        echo "$versions" | tee build/npmjs-versions.txt
