# SPDX-License-Identifier: Apache-2.0
name: Solo TCK
description: Run the JS SDK candidate inside Solo and as a client of its deployed network
inputs:
  component:
    description: Lane to run; currently js-sdk
    required: true
  candidate-packages:
    description: Directory containing the SDK, proto and cryptography pnpm pack tarballs
    required: true
  solo-version:
    description: Verified Solo release or full source SHA; required until a default release is verified
    required: false
  consensus-node-version:
    description: Explicit companion override; otherwise Solo uses its own default
    required: false
  mirror-node-version:
    description: Explicit companion override; otherwise Solo uses its own default
    required: false
outputs:
  outcome:
    description: pass or fail
    value: ${{ steps.run.outputs.outcome }}
  reason:
    description: Empty on pass; candidate, invalid, environment, kit or unknown on failure
    value: ${{ steps.run.outputs.reason }}
  result-file:
    description: Final JSON report, written after cleanup
    value: ${{ steps.run.outputs.result-file }}
runs:
  using: composite
  steps:
    - name: Use verified Node runtime
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - name: Run Solo TCK
      id: run
      shell: bash
      env:
        TCK_PATH: ${{ github.action_path }}
        TCK_COMPONENT: ${{ inputs.component }}
        TCK_PACKAGES: ${{ inputs.candidate-packages }}
        TCK_SOLO_VERSION: ${{ inputs.solo-version }}
        TCK_CN_VERSION: ${{ inputs.consensus-node-version }}
        TCK_MN_VERSION: ${{ inputs.mirror-node-version }}
      run: |
        args=(--component "${TCK_COMPONENT}" --candidate-packages "${TCK_PACKAGES}")
        if [[ -n "${TCK_SOLO_VERSION}" ]]; then args+=(--solo-version "${TCK_SOLO_VERSION}"); fi
        if [[ -n "${TCK_CN_VERSION}" ]]; then args+=(--consensus-node-version "${TCK_CN_VERSION}"); fi
        if [[ -n "${TCK_MN_VERSION}" ]]; then args+=(--mirror-node-version "${TCK_MN_VERSION}"); fi
        node "${TCK_PATH}/src/run.mjs" "${args[@]}"
    - name: Upload Solo TCK evidence
      if: ${{ always() && steps.run.outputs.result-dir != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: solo-tck-js-sdk-${{ github.run_attempt }}
        path: ${{ steps.run.outputs.result-dir }}
        if-no-files-found: error
